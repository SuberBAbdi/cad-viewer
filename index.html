<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DAC CAD Viewer</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="viewer-shell">
    <section id="cadViewer" class="cad-viewer" aria-label="Interactive CAD viewer">
      <canvas id="cadCanvas"></canvas>

      <div class="viewer-toolbar" aria-label="Viewer controls">
        <button id="filterButton" class="tool-button" type="button" aria-expanded="false">Filter</button>
        <button id="homeButton" class="tool-button home-button" type="button" aria-label="Home view">⌂</button>
        <button id="fullscreenButton" class="tool-button" type="button" aria-label="Enter fullscreen">Full screen</button>
      </div>

      <aside id="layerPanel" class="layer-panel" aria-hidden="true">
        <div class="panel-heading">
          <strong>Model layers</strong>
          <button id="closeFilter" type="button" aria-label="Close layers">×</button>
        </div>
        <div class="layer-actions">
          <button id="showAllButton" type="button">Show all</button>
          <button id="isolateButton" type="button">Isolate selected</button>
        </div>
        <div id="layerTree" class="layer-tree"></div>
      </aside>

      <div class="navigation-cluster" aria-label="CAD navigation">
        <button class="cube-arrow arrow-up" data-cube-action="up" aria-label="Rotate view upward">▲</button>
        <button class="cube-arrow arrow-down" data-cube-action="down" aria-label="Rotate view downward">▼</button>
        <button class="cube-arrow arrow-left" data-cube-action="left" aria-label="Rotate view left">◀</button>
        <button class="cube-arrow arrow-right" data-cube-action="right" aria-label="Rotate view right">▶</button>

        <button class="roll-arrow roll-ccw" data-cube-action="rollCCW" aria-label="Roll counter-clockwise">↺</button>
        <button class="roll-arrow roll-cw" data-cube-action="rollCW" aria-label="Roll clockwise">↻</button>

        <div class="cube-stage">
          <div id="viewCube" class="view-cube" role="group" aria-label="Orientation view cube">
            <button class="cube-face front" data-view="front">FRONT</button>
            <button class="cube-face back" data-view="back">BACK</button>
            <button class="cube-face right" data-view="right">RIGHT</button>
            <button class="cube-face left" data-view="left">LEFT</button>
            <button class="cube-face top" data-view="top">TOP</button>
            <button class="cube-face bottom" data-view="bottom">BOTTOM</button>

            <button class="cube-hit edge-top-front" data-view="top-front" aria-label="Top front edge"></button>
            <button class="cube-hit edge-top-back" data-view="top-back" aria-label="Top back edge"></button>
            <button class="cube-hit edge-bottom-front" data-view="bottom-front" aria-label="Bottom front edge"></button>
            <button class="cube-hit edge-bottom-back" data-view="bottom-back" aria-label="Bottom back edge"></button>
            <button class="cube-hit edge-front-right" data-view="front-right" aria-label="Front right edge"></button>
            <button class="cube-hit edge-front-left" data-view="front-left" aria-label="Front left edge"></button>
            <button class="cube-hit edge-back-right" data-view="back-right" aria-label="Back right edge"></button>
            <button class="cube-hit edge-back-left" data-view="back-left" aria-label="Back left edge"></button>

            <button class="cube-hit corner-top-front-right" data-view="top-front-right" aria-label="Top front right corner"></button>
            <button class="cube-hit corner-top-front-left" data-view="top-front-left" aria-label="Top front left corner"></button>
            <button class="cube-hit corner-top-back-right" data-view="top-back-right" aria-label="Top back right corner"></button>
            <button class="cube-hit corner-top-back-left" data-view="top-back-left" aria-label="Top back left corner"></button>
            <button class="cube-hit corner-bottom-front-right" data-view="bottom-front-right" aria-label="Bottom front right corner"></button>
            <button class="cube-hit corner-bottom-front-left" data-view="bottom-front-left" aria-label="Bottom front left corner"></button>
            <button class="cube-hit corner-bottom-back-right" data-view="bottom-back-right" aria-label="Bottom back right corner"></button>
            <button class="cube-hit corner-bottom-back-left" data-view="bottom-back-left" aria-label="Bottom back left corner"></button>
          </div>
        </div>
      </div>

      <button id="activateButton" class="interaction-hint" type="button">Click to interact</button>
      <div id="interactionShield" class="interaction-shield" aria-hidden="true"></div>

      <div id="loading" class="loading" hidden>
        <div class="loading-bar"><span id="loadingProgress"></span></div>
        <span id="loadingText">Loading model…</span>
      </div>
      <div id="error" class="error" hidden></div>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
